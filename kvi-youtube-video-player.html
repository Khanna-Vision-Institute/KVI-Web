<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KVI Video Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0A1628;
            --navy-light: #1a2d4a;
            --gold: #C9A962;
            --gold-light: #E5D4A8;
            --white: #FFFFFF;
            --gray: #8892A0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: var(--navy);
            color: var(--white);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
        }

        .category-bar {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            background: linear-gradient(180deg, var(--navy) 0%, transparent 100%);
            position: relative;
            z-index: 100;
            flex-shrink: 0;
        }

        .logo-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex: 1;
        }

        .category-scroll::-webkit-scrollbar { display: none; }

        .category-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .category-pill.active {
            background: var(--gold);
            color: var(--navy);
        }

        .category-pill:not(.active):hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .cat-icon { font-size: 1rem; }
        .cat-label { font-size: 0.85rem; font-weight: 500; }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--navy);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .loading-overlay.hidden { display: none; }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(201, 169, 98, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 16px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .video-feed {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .video-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .scroll-arrow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            width: 60px;
            height: 60px;
            background: rgba(201, 169, 98, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .scroll-arrow:hover {
            background: rgba(201, 169, 98, 1);
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        .scroll-arrow:active {
            transform: translateX(-50%) scale(0.95);
        }

        .scroll-arrow.top {
            top: 80px;
            animation: bounceDown 2s infinite;
        }

        .scroll-arrow.bottom {
            bottom: 80px;
            animation: bounceUp 2s infinite;
        }

        .scroll-arrow.hidden {
            display: none;
        }

        .scroll-arrow svg {
            width: 28px;
            height: 28px;
            fill: var(--navy);
            stroke: var(--navy);
            stroke-width: 2;
        }

        @keyframes bounceDown {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        @keyframes bounceUp {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        .video-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        .video-slide.current { transform: translateY(0); opacity: 1; z-index: 10; }
        .video-slide.prev { transform: translateY(-100%); opacity: 0; z-index: 5; }
        .video-slide.next { transform: translateY(100%); opacity: 0; z-index: 5; }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(10, 22, 40, 0.3) 0%, transparent 20%, transparent 60%, rgba(10, 22, 40, 0.8) 100%);
            pointer-events: none;
        }

        .video-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(10, 22, 40, 0.7);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .doctor-profile {
            position: absolute;
            right: 12px;
            bottom: 320px;
            z-index: 20;
        }

        .doctor-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            overflow: hidden;
            background: var(--navy);
        }

        .doctor-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .follow-badge {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #FF3B5C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .action-buttons {
            position: absolute;
            right: 12px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 20;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .action-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .action-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .action-btn:hover .action-icon {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        .action-btn.liked .action-icon { background: #FF3B5C; }
        .action-count { font-size: 0.75rem; font-weight: 500; }

        .video-info-overlay {
            position: absolute;
            bottom: 90px;
            left: 16px;
            right: 80px;
            z-index: 20;
        }

        .video-procedure-tag {
            display: inline-block;
            padding: 4px 10px;
            background: var(--gold);
            color: var(--navy);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.3;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cta-floating {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            z-index: 20;
        }

        .cta-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #FFD700, #FFEB3B);
            border: none;
            border-radius: 30px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--navy);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 25px rgba(255, 215, 0, 0.5);
        }

        .cta-btn:active { transform: scale(0.98); }

        .progress-dots {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
        }

        .progress-dot {
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            height: 16px;
            border-radius: 2px;
            background: var(--gold);
        }

        .grid-toggle {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            background: rgba(10, 22, 40, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 25;
            backdrop-filter: blur(10px);
        }

        .grid-toggle svg { width: 18px; height: 18px; fill: white; }

        .grid-view {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--navy);
            z-index: 50;
            overflow-y: auto;
            padding: 60px 8px 20px;
        }

        .grid-view.active { display: block; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }

        .grid-item {
            aspect-ratio: 9/16;
            background: var(--navy-light);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 6px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }

        .grid-item-title {
            font-size: 0.65rem;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .grid-close {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 55;
        }

        .grid-close svg { width: 20px; height: 20px; fill: white; }

        .api-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 22, 40, 0.95);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .api-modal.active { display: flex; }

        .api-modal-content {
            background: var(--navy-light);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }

        .api-modal h3 { color: var(--gold); margin-bottom: 12px; }
        .api-modal p { color: var(--gray); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5; }
        .api-modal a { color: var(--gold); }

        .api-modal input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(201, 169, 98, 0.3);
            border-radius: 8px;
            background: var(--navy);
            color: white;
            font-family: inherit;
            margin-bottom: 16px;
        }

        .api-modal button {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            border: none;
            border-radius: 8px;
            color: var(--navy);
            font-weight: 600;
            cursor: pointer;
        }

        .skip-btn {
            background: transparent !important;
            color: var(--gray) !important;
            margin-top: 8px;
        }

        .video-count-badge {
            background: var(--gold);
            color: var(--navy);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>

    <div class="api-modal" id="apiModal">
        <div class="api-modal-content">
            <h3>🔑 YouTube API Key</h3>
            <p>Enter your YouTube Data API key to load all videos from the @KhannaVision channel.<br><br>Get a free key at <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a> → Enable YouTube Data API v3</p>
            <input type="text" id="apiKeyInput" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">Load Videos</button>
            <button class="skip-btn" onclick="skipApiKey()">Use Demo Videos</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            CHANNEL_HANDLE: 'KhannaVision', // @KhannaVision
            CHANNEL_ID: 'UCFf6F9grsR0z0xftFIicKIw', // KhannaVision channel ID (fallback if handle lookup fails)
            API_KEY: localStorage.getItem('yt_api_key') || '' /* REDACTED for Git: hardcoded Google API key removed */, // YT KVI
            // Auto-use CORS proxy when running from file:// or localhost
            USE_PROXY: window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        };
        
        function apiUrl(url) {
            return CONFIG.USE_PROXY ? `https://corsproxy.io/?${encodeURIComponent(url)}` : url;
        }

        const CATEGORY_KEYWORDS = {
            smile: ['smile', 'relex', 'small incision', 'visumax'],
            lasik: ['lasik', 'laser eye', 'wavefront', 'allegretto', 'bladeless'],
            icl: ['icl', 'implantable', 'collamer', 'evo icl', 'visian', 'phakic'],
            pie: ['pie', 'presbyopic', 'reading glasses', 'presbyopia', 'multifocal', 'prelex'],
            cataract: ['cataract', 'lens replacement', 'iol', 'intraocular'],
            celebrity: ['brenda song', 'corbin bleu', 'celebrity', 'poorman', 'bas rutten', 'ryan bailey', 'stephanie beacham', 'kamar', 'sheri saum']
        };

        let allVideos = [];
        let filteredVideos = [];
        let currentIndex = 0;
        let startY = 0, currentY = 0, isDragging = false;
        let videosToRender = 10; // Number of videos to render at a time
        let renderedVideosCount = 0; // How many videos are currently rendered

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Initializing YouTube Video Player...');
            console.log('API Key:', CONFIG.API_KEY ? CONFIG.API_KEY.substring(0, 10) + '...' : 'Not set');
            console.log('Channel Handle:', CONFIG.CHANNEL_HANDLE);
            console.log('Using Proxy:', CONFIG.USE_PROXY);
            
            if (CONFIG.USE_PROXY) {
                console.log('Running locally - using CORS proxy');
            }
            if (CONFIG.API_KEY) {
                await loadVideosFromAPI();
            } else {
                document.getElementById('apiModal').classList.add('active');
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        });

        async function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                CONFIG.API_KEY = key;
                localStorage.setItem('yt_api_key', key);
                document.getElementById('apiModal').classList.remove('active');
                document.getElementById('loadingOverlay').classList.remove('hidden');
                await loadVideosFromAPI();
            }
        }

        function skipApiKey() {
            document.getElementById('apiModal').classList.remove('active');
            loadDemoVideos();
        }

        async function loadVideosFromAPI() {
            try {
                // First, try to get channel ID from handle (optional, we have fallback)
                if (CONFIG.CHANNEL_HANDLE && !CONFIG.CHANNEL_ID) {
                    document.querySelector('.loading-text').textContent = `Fetching channel info for @${CONFIG.CHANNEL_HANDLE}...`;
                    
                    // Try method 1: forHandle parameter (newer API)
                    try {
                        const channelUrl = `https://www.googleapis.com/youtube/v3/channels?part=id,contentDetails&forHandle=${CONFIG.CHANNEL_HANDLE}&key=${CONFIG.API_KEY}`;
                        const channelResponse = await fetch(apiUrl(channelUrl));
                        const channelData = await channelResponse.json();
                        
                        if (channelData.error) {
                            console.error('Channel API Error:', channelData.error);
                            throw new Error(channelData.error.message || 'Channel lookup failed');
                        }
                        
                        if (channelData.items && channelData.items.length > 0) {
                            CONFIG.CHANNEL_ID = channelData.items[0].id;
                            console.log('Found channel ID via forHandle:', CONFIG.CHANNEL_ID);
                        } else {
                            throw new Error('Channel not found via forHandle');
                        }
                    } catch (handleError) {
                        console.warn('forHandle method failed, trying alternative method:', handleError);
                        // Try method 2: Use search API to find channel
                        document.querySelector('.loading-text').textContent = `Searching for channel @${CONFIG.CHANNEL_HANDLE}...`;
                        const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(CONFIG.CHANNEL_HANDLE)}&type=channel&maxResults=1&key=${CONFIG.API_KEY}`;
                        const searchResponse = await fetch(apiUrl(searchUrl));
                        const searchData = await searchResponse.json();
                        
                        if (searchData.error) {
                            console.error('Search API Error:', searchData.error);
                            throw new Error(searchData.error.message || 'Channel search failed');
                        }
                        
                        if (searchData.items && searchData.items.length > 0) {
                            CONFIG.CHANNEL_ID = searchData.items[0].id.channelId;
                            console.log('Found channel ID via search:', CONFIG.CHANNEL_ID);
                        } else {
                            throw new Error('Channel not found via search');
                        }
                    }
                }

                // Use fallback channel ID if handle lookup failed
                if (!CONFIG.CHANNEL_ID) {
                    console.warn('Using fallback channel ID');
                    CONFIG.CHANNEL_ID = 'UCFf6F9grsR0z0xftFIicKIw'; // KhannaVision channel ID
                }
                
                console.log('Using Channel ID:', CONFIG.CHANNEL_ID);

                let nextPageToken = '';
                let totalVideos = [];

                // Fetch all pages of videos
                do {
                    const baseUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CONFIG.CHANNEL_ID}&maxResults=50&type=video&order=date${nextPageToken ? '&pageToken=' + nextPageToken : ''}&key=${CONFIG.API_KEY}`;
                    const response = await fetch(apiUrl(baseUrl));
                    const data = await response.json();

                    if (data.error) {
                        console.error('API Error:', data.error);
                        alert('API Error: ' + data.error.message + '\n\nTry running from a web server or check API key settings.');
                        loadDemoVideos();
                        return;
                    }

                    if (data.items) {
                        totalVideos = [...totalVideos, ...data.items];
                    }
                    nextPageToken = data.nextPageToken || '';
                    
                    document.querySelector('.loading-text').textContent = `Loading videos from @${CONFIG.CHANNEL_HANDLE}... (${totalVideos.length} found)`;
                } while (nextPageToken && totalVideos.length < 500);

                // Process videos
                allVideos = totalVideos.map(item => ({
                    id: item.id.videoId,
                    title: item.snippet.title,
                    thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default.url,
                    category: detectCategory(item.snippet.title + ' ' + (item.snippet.description || '')),
                    publishedAt: item.snippet.publishedAt
                }));

                console.log(`Loaded ${allVideos.length} videos from YouTube`);

                // Get stats in batches
                await enrichVideoStats();
                updateCategoryCounts();
                initializePlayer();
            } catch (error) {
                console.error('Failed to load videos:', error);
                console.error('Error details:', {
                    message: error.message,
                    stack: error.stack,
                    channelHandle: CONFIG.CHANNEL_HANDLE,
                    hasApiKey: !!CONFIG.API_KEY,
                    apiKeyLength: CONFIG.API_KEY ? CONFIG.API_KEY.length : 0
                });
                
                let errorMessage = 'Failed to load videos from YouTube.\n\n';
                if (error.message) {
                    errorMessage += `Error: ${error.message}\n\n`;
                }
                errorMessage += 'Possible causes:\n';
                errorMessage += '1. API key may be invalid or have restrictions\n';
                errorMessage += '2. YouTube Data API v3 may not be enabled\n';
                errorMessage += '3. CORS issues (try running from a web server)\n';
                errorMessage += '4. Channel handle may be incorrect\n\n';
                errorMessage += 'Check the browser console for more details.';
                
                alert(errorMessage);
                loadDemoVideos();
            }
        }

        async function enrichVideoStats() {
            const batchSize = 50;
            for (let i = 0; i < allVideos.length; i += batchSize) {
                const batch = allVideos.slice(i, i + batchSize);
                const ids = batch.map(v => v.id).join(',');
                try {
                    const baseUrl = `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${ids}&key=${CONFIG.API_KEY}`;
                    const response = await fetch(apiUrl(baseUrl));
                    const data = await response.json();

                    if (data.items) {
                        data.items.forEach(item => {
                            const video = allVideos.find(v => v.id === item.id);
                            if (video && item.statistics) {
                                video.likes = formatCount(item.statistics.likeCount || 0);
                                video.comments = formatCount(item.statistics.commentCount || 0);
                                video.views = formatCount(item.statistics.viewCount || 0);
                            }
                        });
                    }
                } catch (e) {
                    console.log('Stats batch error:', e);
                }
            }
        }

        function loadDemoVideos() {
            allVideos = [
                { id: 'mDOVNRQ5G5Y', title: 'Toric Visian ICL for Vision Correction - Dr. Khanna', category: 'icl' },
                { id: 'aUbXkn5TtkU', title: 'Happy LASIK Patient - Life Without Glasses', category: 'lasik' },
                { id: 'tsOaIIJj', title: 'SMILE LASIK Success Story', category: 'smile' },
            ].map(v => ({
                ...v,
                thumbnail: `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`,
                likes: Math.floor(Math.random() * 15 + 5) + 'K',
                comments: Math.floor(Math.random() * 800 + 100),
                views: Math.floor(Math.random() * 40 + 10) + 'K'
            }));
            updateCategoryCounts();
            initializePlayer();
        }

        function detectCategory(text) {
            const lowerText = text.toLowerCase();
            for (const [category, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
                if (keywords.some(kw => lowerText.includes(kw))) {
                    return category;
                }
            }
            return 'lasik';
        }

        function formatCount(num) {
            num = parseInt(num) || 0;
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function updateCategoryCounts() {
            const counts = { all: allVideos.length };
            Object.keys(CATEGORY_KEYWORDS).forEach(cat => {
                counts[cat] = allVideos.filter(v => v.category === cat).length;
            });

            document.querySelectorAll('.category-pill').forEach(pill => {
                const cat = pill.dataset.category;
                const count = counts[cat] || 0;
                let badge = pill.querySelector('.video-count-badge');
                if (count > 0) {
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'video-count-badge';
                        pill.appendChild(badge);
                    }
                    badge.textContent = count;
                }
            });
        }

        function initializePlayer() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            filteredVideos = [...allVideos];
            currentIndex = 0;
            renderedVideosCount = 0;
            renderVideos(true);
            setupSwipe();
            setupCategories();
            updateSlides(); // Initialize arrow visibility
        }

        function renderVideos(reset = true) {
            const container = document.getElementById('videoViewport');
            
            // Preserve scroll arrows
            const topArrow = document.getElementById('scrollArrowTop');
            const bottomArrow = document.getElementById('scrollArrowBottom');
            const arrowsHTML = topArrow ? topArrow.outerHTML + (bottomArrow ? bottomArrow.outerHTML : '') : '';
            
            if (reset) {
                container.innerHTML = '';
                renderedVideosCount = 0;
            }

            if (filteredVideos.length === 0) {
                container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--gray);text-align:center;padding:20px;">No videos in this category yet</div>';
                if (arrowsHTML) {
                    container.insertAdjacentHTML('beforeend', arrowsHTML);
                }
                return;
            }

            // Determine how many videos to render
            const videosToLoad = Math.min(videosToRender, filteredVideos.length - renderedVideosCount);
            const startIndex = renderedVideosCount;
            const endIndex = startIndex + videosToLoad;

            // Render only the batch of videos
            for (let i = startIndex; i < endIndex; i++) {
                const video = filteredVideos[i];
                const index = i;
                const slide = document.createElement('div');
                slide.className = `video-slide ${index === currentIndex ? 'current' : index < currentIndex ? 'prev' : 'next'}`;
                slide.innerHTML = `
                    <div class="video-container">
                        <iframe 
                            src="https://www.youtube.com/embed/${video.id}?autoplay=${index === currentIndex ? 1 : 0}&mute=0&loop=1&playlist=${video.id}&controls=0&modestbranding=1&playsinline=1"
                            frameborder="0"
                            allow="autoplay; encrypted-media"

            }

            // Update slides to show current video
            updateSlides();

            renderGrid();
        }

        function loadMoreVideos() {
            if (renderedVideosCount < filteredVideos.length) {
                renderVideos(false); // Don't reset, just add more
            }
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = filteredVideos.map((video, index) => `
                <div class="grid-item" onclick="jumpToVideo(${index})">
                    <img src="${video.thumbnail}" alt="${video.title}" loading="lazy">
                    <div class="grid-item-overlay">
                        <div class="grid-item-title">${video.title}</div>
                    </div>
                </div>
            `).join('');
        }

        function setupSwipe() {
            const viewport = document.getElementById('videoViewport');
            
            viewport.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                isDragging = true;
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentY = e.touches[0].clientY;
            }, { passive: true });

            viewport.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                
                const diff = startY - currentY;
                if (Math.abs(diff) > 50) {
                    if (diff > 0 && currentIndex < filteredVideos.length - 1) navigateVideo(1);
                    else if (diff < 0 && currentIndex > 0) navigateVideo(-1);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' && currentIndex < filteredVideos.length - 1) navigateVideo(1);
                else if (e.key === 'ArrowUp' && currentIndex > 0) navigateVideo(-1);
            });
        }

        function navigateVideo(direction) {
            currentIndex += direction;
            
            // Load more videos if approaching the end
            if (currentIndex >= renderedVideosCount - 3 && renderedVideosCount < filteredVideos.length) {
                loadMoreVideos();
            }
            
            updateSlides();
        }

        function updateSlides() {
            document.querySelectorAll('.video-slide').forEach((slide, index) => {
                slide.className = 'video-slide ' + (index === currentIndex ? 'current' : index < currentIndex ? 'prev' : 'next');
            });
            document.querySelectorAll('.progress-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
            
            // Update scroll arrows visibility
            const topArrow = document.getElementById('scrollArrowTop');
            const bottomArrow = document.getElementById('scrollArrowBottom');
            
            if (topArrow) {
                topArrow.classList.toggle('hidden', currentIndex === 0);
            }
            if (bottomArrow) {
                bottomArrow.classList.toggle('hidden', currentIndex >= filteredVideos.length - 1);
            }
        }

        function setupCategories() {
            document.querySelectorAll('.category-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const category = btn.dataset.category;
                    filteredVideos = category === 'all' ? [...allVideos] : allVideos.filter(v => v.category === category);
                    currentIndex = 0;
                    renderedVideosCount = 0;
                    renderVideos(true);
                });
            });
        }

        function toggleGrid() { document.getElementById('gridView').classList.toggle('active'); }
        function jumpToVideo(index) { currentIndex = index; updateSlides(); toggleGrid(); }
        function toggleLike(btn) { btn.classList.toggle('liked'); }
        function openComments() { window.open(`https://www.youtube.com/watch?v=${filteredVideos[currentIndex].id}`, '_blank'); }
        
        function shareVideo(videoId) {
            const url = `https://www.youtube.com/watch?v=${videoId}`;
            if (navigator.share) {
                navigator.share({ title: 'Vision Correction Video - Dr. Khanna', url });
            } else {
                navigator.clipboard.writeText(url);
                alert('Link copied!');
            }
        }

        function bookConsult() { window.open('https://khannainstitute.com/book-consultation/', '_blank'); }
    </script>
</body>
</html>
