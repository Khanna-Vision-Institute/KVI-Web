<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#070f1a" />
  <title>Thank You — VIP Consult | Khanna Vision Institute</title>
  <meta name="description" content="Thank you — Khanna Vision Institute will contact you soon. Check your email for details on receiving the book." />
  <link rel="canonical" href="https://khannainstitute.com/VIP-Consult/thank-you/" />

  <!-- Google tag (gtag.js) — same as VIP Consult -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q0TGBPVS92"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Q0TGBPVS92');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #070f1a;
      --gold: #c9a84c;
      --gold-light: #e0c878;
      --white: #ffffff;
      --ty-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: 'Inter', sans-serif;
      color: rgba(255, 255, 255, 0.72);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 100% 80% at 50% -20%, rgba(201, 168, 76, 0.09), transparent 55%),
        radial-gradient(ellipse 80% 60% at 12% 18%, rgba(201, 168, 76, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 92% 72%, rgba(22, 50, 86, 0.45) 0%, transparent 52%),
        radial-gradient(ellipse 60% 40% at 0% 100%, rgba(201, 168, 76, 0.06), transparent 50%),
        linear-gradient(168deg, #0b1628 0%, #050a12 42%, #060d18 100%);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 248, 232, 0.04), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(201, 168, 76, 0.05), transparent 35%);
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Header — matches VIP Consult */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 60;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, transparent 40%),
        linear-gradient(135deg, #0a1628 0%, #050c16 50%, #0a1424 100%);
      border-bottom: 1px solid rgba(201, 168, 76, 0.22);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      padding: 0 clamp(20px, 4vw, 48px);
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .site-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.55), transparent);
      opacity: 0.85;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.5vw, 16px);
      text-decoration: none;
      min-width: 0;
    }
    .header-logo {
      display: block;
      flex-shrink: 0;
      width: auto;
      height: clamp(48px, 5.5vw, 62px);
      max-width: min(200px, 38vw);
      object-fit: contain;
      object-position: left center;
    }
    .header-brand-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.95rem, 2.2vw, 1.28rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      line-height: 1.15;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      background: linear-gradient(118deg, #fff8e8 0%, #e8cf8a 38%, #c9a84c 52%, #f0e0b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: min(260px, 48vw);
    }
    @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
      .header-brand-text {
        background: none;
        -webkit-text-fill-color: unset;
        color: #e8cf8a;
      }
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: clamp(14px, 3vw, 28px);
      flex-shrink: 0;
    }
    .header-phone {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.82rem, 1.2vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #ffeb3b;
      text-decoration: none;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(255, 235, 59, 0.35), 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .site-header,
    .ty-main {
      position: relative;
      z-index: 1;
    }

    @keyframes tyFadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes tyGlow {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }

    /* Main — editorial stage */
    .ty-main {
      flex: 1;
      padding: clamp(48px, 7vw, 88px) clamp(20px, 4vw, 48px) clamp(72px, 10vw, 120px);
    }
    .ty-frame {
      max-width: min(1040px, 100%);
      margin: 0 auto;
      padding: 1px;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        rgba(201, 168, 76, 0.45) 0%,
        rgba(255, 248, 232, 0.12) 35%,
        rgba(201, 168, 76, 0.25) 55%,
        rgba(22, 50, 86, 0.35) 100%
      );
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 48px 100px rgba(0, 0, 0, 0.55),
        0 0 80px rgba(201, 168, 76, 0.06);
      animation: tyFadeUp 1s var(--ty-ease) both;
    }
    .ty-inner {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: clamp(36px, 5vw, 64px);
      align-items: center;
      padding: clamp(36px, 5vw, 56px) clamp(28px, 4.5vw, 52px);
      border-radius: 19px;
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0) 38%),
        linear-gradient(145deg, rgba(8, 14, 26, 0.88) 0%, rgba(4, 8, 16, 0.97) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }
    .ty-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 248, 220, 0.35), transparent);
      opacity: 0.9;
    }
    .ty-inner::after {
      content: '';
      position: absolute;
      width: min(420px, 70vw);
      height: min(420px, 70vw);
      top: -18%;
      right: -12%;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.14) 0%, transparent 68%);
      pointer-events: none;
    }

    .ty-book-col {
      position: relative;
      justify-self: center;
      max-width: min(300px, 100%);
      width: 100%;
    }
    .ty-book-halo {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 118%;
      height: 118%;
      background: radial-gradient(
        ellipse 50% 48% at 50% 50%,
        rgba(201, 168, 76, 0.22) 0%,
        rgba(201, 168, 76, 0.06) 45%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 0;
      animation: tyGlow 7s ease-in-out infinite;
    }
    .ty-book {
      position: relative;
      z-index: 1;
      width: 100%;
    }
    .book-cover-wrap {
      position: relative;
    }
    .book-cover-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      box-shadow:
        -18px 24px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(201, 168, 76, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: perspective(1100px) rotateY(-9deg) rotateX(3deg) rotateZ(-1.2deg);
      transition: transform 0.7s var(--ty-ease), box-shadow 0.7s var(--ty-ease);
    }
    .ty-book-col:hover .book-cover-wrap img {
      transform: perspective(1100px) rotateY(-4deg) rotateX(1deg) rotateZ(0) scale(1.02);
      box-shadow:
        -22px 28px 72px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(201, 168, 76, 0.22),
        0 0 48px rgba(201, 168, 76, 0.12);
    }
    .book-cover-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: linear-gradient(
        125deg,
        transparent 32%,
        rgba(255, 255, 255, 0.28) 48%,
        transparent 62%
      );
      pointer-events: none;
      mix-blend-mode: soft-light;
    }
    .book-badge {
      position: absolute;
      top: -12px;
      right: -12px;
      z-index: 4;
      background: linear-gradient(135deg, #f0e0b8, var(--gold) 45%, #a67c28);
      color: var(--navy);
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 2px;
      box-shadow:
        0 6px 24px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .ty-copy {
      min-width: 0;
      position: relative;
      z-index: 1;
      padding-right: clamp(0px, 2vw, 12px);
    }
    .ty-kicker {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(201, 168, 76, 0.75);
      margin-bottom: 1rem;
    }
    .ty-ornament {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.25rem;
      color: rgba(201, 168, 76, 0.5);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      line-height: 1;
    }
    .ty-ornament::before,
    .ty-ornament::after {
      content: '';
      flex: 1;
      max-width: 72px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.45), transparent);
    }
    .ty-copy h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.35rem, 5.5vw, 3.65rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 0.5em;
      background: linear-gradient(118deg, #fff8e8 0%, #e8cf8a 32%, #c9a84c 48%, #f5ead0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 24px rgba(201, 168, 76, 0.12));
    }
    @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
      .ty-copy h1 {
        background: none;
        -webkit-text-fill-color: unset;
        color: #e8cf8a;
      }
    }
    .ty-copy .ty-body {
      font-size: clamp(0.95rem, 1.5vw, 1.05rem);
      font-weight: 300;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.58);
      max-width: 26rem;
      margin-bottom: 0;
    }
    .ty-copy .ty-body strong {
      color: rgba(255, 255, 255, 0.92);
      font-weight: 500;
    }

    .ty-actions {
      margin-top: 2.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .ty-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 15px 32px;
      border-radius: 2px;
      color: var(--navy);
      background: linear-gradient(145deg, #f2e5c0 0%, var(--gold) 42%, #9a7a1a 100%);
      border: 1px solid rgba(255, 248, 220, 0.35);
      box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.25s var(--ty-ease), filter 0.25s var(--ty-ease), box-shadow 0.25s var(--ty-ease);
    }
    .ty-cta:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 0 40px rgba(201, 168, 76, 0.15);
    }
    .ty-cta:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    @media (max-width: 768px) {
      .ty-inner {
        grid-template-columns: 1fr;
        text-align: center;
        padding: clamp(32px, 6vw, 44px) clamp(22px, 5vw, 32px);
      }
      .ty-copy { padding-right: 0; }
      .ty-copy .ty-body { margin-left: auto; margin-right: auto; }
      .ty-ornament { justify-content: center; }
      .ty-ornament::before,
      .ty-ornament::after { max-width: 48px; }
      .ty-actions { justify-content: center; }
      .header-brand-text { display: none; }
    }
  </style>
  <script src="/public/js/consult-conversion.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="header-brand">
      <img
        class="header-logo"
        src="https://khanna-media-bucket.s3.us-east-1.amazonaws.com/Logo1.png"
        alt=""

  <main class="ty-main">
    <div class="ty-frame">
      <div class="ty-inner">
        <div class="ty-book-col">
          <div class="ty-book-halo" aria-hidden="true"></div>
          <div class="ty-book">
            <div class="book-cover-wrap">
              <img

        </div>
        <div class="ty-copy">
          <p class="ty-kicker">VIP consult</p>
          <div class="ty-ornament" aria-hidden="true"><span>◆</span></div>
          <h1>Thank you</h1>
          <p class="ty-body">
            Our team will contact you soon. <strong>Check your email</strong> for details on receiving the book.
          </p>
          <div class="ty-actions">
            <a class="ty-cta" href="/">Return home</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    if (window.KviConsultConversion) window.KviConsultConversion.reportSuccess('vip');
  </script>
</body>
</html>
