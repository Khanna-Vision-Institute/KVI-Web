        /* Before/After Slider */

            position: relative;
            overflow: hidden;

        }
        .ba-slider img {
            width: 100%;
            height: auto;
            display: block;
        }
        .ba-resize {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        .ba-resize img {
            width: 100%; /* Will be overridden by JS */
        }
        .ba-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 90%;
            background-color: white;
            opacity: 0.8;
            cursor: ew-resize;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ba-handle::after {
            content: ' ';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid white;
            border-radius: 50%;
            background: rgba(13, 148, 136, 0.7); /* teal-700 with opacity */
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .ba-handle-arrows::before,
        .ba-handle-arrows::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }
        .ba-handle-arrows::before {
            left: -10px;
            border-width: 8px 10px 8px 0;

        }
        .ba-handle-arrows::after {
            right: -10px;
            border-width: 8px 0 8px 10px;
            border-color: transparent transparent transparent white;
        }
        
        .ba-range {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: ew-resize;
            z-index: 10;
        }
        .ba-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 100%;
            width: 4px;

        }
        .ba-range::-moz-range-thumb {
            height: 100%;
            width: 4px;
            cursor: ew-resize;
            border: none;

        }
        .ba-range::-ms-thumb {
